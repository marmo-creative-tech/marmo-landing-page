<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="cpopcBg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#053E23"/>
      <stop offset="100%" stop-color="#022414"/>
    </linearGradient>
    <linearGradient id="cpopcGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="cpopcGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Base -->
  <circle cx="80" cy="80" r="76" fill="url(#cpopcBg)" stroke="#10B981" stroke-width="3"/>
  <circle cx="80" cy="80" r="70" stroke="url(#cpopcGold)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Palm Leaf Fronds / Globe Icon Motif -->
  <g transform="translate(80, 62)">
    <!-- Central Leaf -->
    <path d="M 0 -24 C 6 -12 8 8 0 20 C -8 8 -6 -12 0 -24 Z" fill="url(#cpopcGold)"/>
    <!-- Right Fronds -->
    <path d="M 4 -16 C 16 -12 24 2 12 14 C 6 6 4 -6 4 -16 Z" fill="url(#cpopcGreen)"/>
    <path d="M 6 -4 C 20 2 24 16 14 24 C 8 16 6 6 6 -4 Z" fill="url(#cpopcGreen)"/>
    <!-- Left Fronds -->
    <path d="M -4 -16 C -16 -12 -24 2 -12 14 C -6 6 -4 -6 -4 -16 Z" fill="url(#cpopcGreen)"/>
    <path d="M -6 -4 C -20 2 -24 16 -14 24 C -8 16 -6 6 -6 -4 Z" fill="url(#cpopcGreen)"/>
    <!-- Base Trunk -->
    <rect x="-2.5" y="16" width="5" height="12" rx="2.5" fill="url(#cpopcGold)"/>
  </g>

  <!-- Council Wordmark -->
  <text x="80" y="112" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="2" text-anchor="middle">CPOPC</text>
  <text x="80" y="126" fill="#FDE047" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.5" text-anchor="middle">COUNCIL OF PALM OIL</text>
  <text x="80" y="135" fill="#34D399" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6" font-weight="600" letter-spacing="0.8" text-anchor="middle">PRODUCING COUNTRIES</text>
</svg>