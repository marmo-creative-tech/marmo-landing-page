<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="artGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#28205C" />
      <stop offset="100%" stop-color="#120E2E" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDE59" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="canvasGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F2766" />
      <stop offset="100%" stop-color="#1E1845" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="16" fill="url(#artGrad)" />
  <circle cx="80" cy="60" r="110" fill="#FF9E1B" fill-opacity="0.1" />
  <circle cx="330" cy="180" r="100" fill="#7353BA" fill-opacity="0.15" />

  <!-- Orbit Rings -->
  <ellipse cx="200" cy="120" rx="150" ry="55" stroke="#7353BA" stroke-opacity="0.3" stroke-dasharray="3 5" />
  <circle cx="320" cy="85" r="7" fill="#FFCA3A" />
  <circle cx="90" cy="145" r="5" fill="#FF9E1B" />

  <!-- Design Artboard / Canvas -->
  <g transform="translate(70, 30)">
    <!-- Canvas Window -->
    <rect x="0" y="0" width="260" height="175" rx="14" fill="url(#canvasGrad)" stroke="#FF9E1B" stroke-width="2.5" />
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="260" height="28" rx="12" fill="#1C1744" />
    <circle cx="16" cy="14" r="4" fill="#FF5F56" />
    <circle cx="28" cy="14" r="4" fill="#FFBD2E" />
    <circle cx="40" cy="14" r="4" fill="#27C93F" />
    <text x="60" y="18" fill="#A5A1D6" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">brand-identity_v2.ai</text>

    <!-- Bezier Curve & Nodes -->
    <path d="M 35 130 C 60 40, 140 160, 200 65" fill="none" stroke="#FF9E1B" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Tangent Handles -->
    <line x1="35" y1="130" x2="60" y2="40" stroke="#FFDE59" stroke-width="1.5" stroke-dasharray="2 3" />
    <line x1="200" y1="65" x2="140" y2="160" stroke="#7353BA" stroke-width="1.5" stroke-dasharray="2 3" />
    
    <circle cx="35" cy="130" r="5" fill="#FF9E1B" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="60" cy="40" r="4" fill="#FFDE59" />
    <circle cx="140" cy="160" r="4" fill="#7353BA" />
    <circle cx="200" cy="65" r="5" fill="#FF9E1B" stroke="#FFFFFF" stroke-width="2" />

    <!-- Color Swatches Bar -->
    <rect x="25" y="138" width="105" height="24" rx="6" fill="#151133" stroke="#3D357A" stroke-width="1" />
    <circle cx="40" cy="150" r="7" fill="#FF9E1B" />
    <circle cx="60" cy="150" r="7" fill="#FFCA3A" />
    <circle cx="80" cy="150" r="7" fill="#7353BA" />
    <circle cx="100" cy="150" r="7" fill="#4E95FF" />
    <circle cx="118" cy="150" r="7" fill="#FFFFFF" />

    <!-- Floating Pen Tool -->
    <g transform="translate(180, 45) rotate(28)">
      <path d="M0 0 L15 -20 L30 -5 L10 15 Z" fill="url(#penGrad)" stroke="#120E2E" stroke-width="2" />
      <polygon points="0,0 -8,8 0,8" fill="#FFFFFF" />
      <circle cx="8" cy="-3" r="2.5" fill="#120E2E" />
    </g>

    <!-- Typography Badge "MARMO" -->
    <g transform="translate(145, 115)">
      <rect x="0" y="0" width="95" height="34" rx="8" fill="#FF9E1B" stroke="#120E2E" stroke-width="2" />
      <text x="12" y="23" fill="#120E2E" font-family="'Lilita One', sans-serif" font-weight="900" font-size="16" letter-spacing="1">DESIGN</text>
      <circle cx="82" cy="17" r="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Sparkles -->
  <polygon points="350,50 353,56 360,58 353,60 350,67 347,60 340,58 347,56" fill="#FFDE59" />
  <polygon points="45,185 47,190 53,192 47,194 45,200 43,194 37,192 43,190" fill="#FF9E1B" />
</svg>
