<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="uiGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1742" />
      <stop offset="100%" stop-color="#0C0A1E" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C163E" />
      <stop offset="100%" stop-color="#120D2C" />
    </linearGradient>
    <linearGradient id="uiCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="uiGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD13B" />
      <stop offset="100%" stop-color="#FF9E1B" />
    </linearGradient>
    <linearGradient id="uiPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7353BA" />
    </linearGradient>
    <filter id="uiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="16" fill="url(#uiGrad)" />
  <circle cx="100" cy="50" r="100" fill="#38BDF8" fill-opacity="0.12" filter="url(#uiGlow)" />
  <circle cx="310" cy="190" r="100" fill="#7353BA" fill-opacity="0.15" filter="url(#uiGlow)" />

  <!-- Grid Blueprint Dots -->
  <g opacity="0.18">
    <circle cx="50" cy="40" r="1.5" fill="#FFFFFF" />
    <circle cx="80" cy="40" r="1.5" fill="#FFFFFF" />
    <circle cx="110" cy="40" r="1.5" fill="#FFFFFF" />
    <circle cx="290" cy="40" r="1.5" fill="#FFFFFF" />
    <circle cx="320" cy="40" r="1.5" fill="#FFFFFF" />
    <circle cx="350" cy="40" r="1.5" fill="#FFFFFF" />
    <circle cx="50" cy="200" r="1.5" fill="#FFFFFF" />
    <circle cx="80" cy="200" r="1.5" fill="#FFFFFF" />
    <circle cx="110" cy="200" r="1.5" fill="#FFFFFF" />
    <circle cx="290" cy="200" r="1.5" fill="#FFFFFF" />
    <circle cx="320" cy="200" r="1.5" fill="#FFFFFF" />
    <circle cx="350" cy="200" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Primary Figma Artboard (Desktop / Tablet Frame) -->
  <g transform="translate(60, 30)">
    <rect width="210" height="155" rx="10" fill="url(#boardGrad)" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="2" />
    
    <!-- Artboard Title Tag -->
    <rect x="0" y="-18" width="85" height="15" rx="4" fill="#38BDF8" />
    <text x="8" y="-7" fill="#0C0A1E" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800">FRAME / WEB V2</text>
    
    <!-- Top Nav wireframe -->
    <rect x="15" y="14" width="28" height="8" rx="4" fill="#FF9E1B" />
    <rect x="52" y="16" width="20" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="78" y="16" width="20" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="104" y="16" width="20" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="160" y="12" width="35" height="12" rx="6" fill="#7353BA" />

    <!-- Hero Card Wireframe inside Artboard -->
    <rect x="15" y="34" width="180" height="60" rx="8" fill="#140F2D" stroke="rgba(255,255,255,0.08)" />
    <rect x="25" y="44" width="75" height="10" rx="4" fill="url(#uiGold)" />
    <rect x="25" y="60" width="105" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.5" />
    <rect x="25" y="70" width="85" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
    <rect x="145" y="42" width="40" height="44" rx="6" fill="#241B4B" />
    <circle cx="165" cy="64" r="12" fill="#38BDF8" fill-opacity="0.4" />

    <!-- 2 Column Widgets -->
    <rect x="15" y="102" width="85" height="40" rx="6" fill="#140F2D" stroke="rgba(255,255,255,0.06)" />
    <circle cx="28" cy="116" r="6" fill="#EC4899" />
    <rect x="40" y="114" width="45" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.6" />
    <rect x="25" y="128" width="65" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3" />

    <rect x="110" y="102" width="85" height="40" rx="6" fill="#140F2D" stroke="rgba(255,255,255,0.06)" />
    <circle cx="123" cy="116" r="6" fill="#10B981" />
    <rect x="135" y="114" width="45" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.6" />
    <rect x="120" y="128" width="65" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3" />
  </g>

  <!-- Interactive Mobile Artboard Floating in Foreground (Right) -->
  <g transform="translate(245, 50)">
    <rect width="95" height="160" rx="14" fill="#171136" stroke="url(#uiGold)" stroke-width="2" />
    <rect x="0" y="-18" width="70" height="15" rx="4" fill="#FF9E1B" />
    <text x="8" y="-7" fill="#0C0A1E" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800">MOBILE UX</text>
    
    <!-- Mobile Screen Elements -->
    <circle cx="47" cy="22" r="10" fill="url(#uiPurple)" />
    <rect x="15" y="40" width="65" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="15" y="55" width="65" height="32" rx="6" fill="#241B4B" />
    
    <!-- Toggle Switch Component -->
    <rect x="15" y="98" width="65" height="20" rx="10" fill="#120D2A" />
    <rect x="38" y="100" width="40" height="16" rx="8" fill="#10B981" />
    <circle cx="68" cy="108" r="6" fill="#FFFFFF" />
    
    <!-- Floating Primary CTA -->
    <rect x="15" y="128" width="65" height="18" rx="9" fill="url(#uiCyan)" />
    <text x="47" y="140" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" text-anchor="middle">PROTOTYPE</text>
  </g>

  <!-- Figma Interactive Vector Cursor & Click Ripple -->
  <g transform="translate(180, 110)">
    <circle cx="6" cy="6" r="14" stroke="#38BDF8" stroke-width="2" fill="#38BDF8" fill-opacity="0.25">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Cursor Arrow -->
    <path d="M 0 0 L 16 12 L 8 13 L 5 19 Z" fill="#FF9E1B" stroke="#000000" stroke-width="1.5" />
    <!-- Designer Name Pill -->
    <rect x="16" y="8" width="48" height="14" rx="4" fill="#FF9E1B" />
    <text x="20" y="18" fill="#0C0A1E" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800">UI / UX</text>
  </g>

  <!-- Color Palette Swatch Component (Bottom Left) -->
  <g transform="translate(45, 175)">
    <rect width="80" height="24" rx="6" fill="#171233" stroke="#7353BA" stroke-width="1" />
    <circle cx="16" cy="12" r="6" fill="#FF9E1B" />
    <circle cx="32" cy="12" r="6" fill="#7353BA" />
    <circle cx="48" cy="12" r="6" fill="#38BDF8" />
    <circle cx="64" cy="12" r="6" fill="#EC4899" />
  </g>
</svg>