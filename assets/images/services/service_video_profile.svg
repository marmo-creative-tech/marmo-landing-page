<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="camGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#28205C" />
      <stop offset="100%" stop-color="#120E2E" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <linearGradient id="lensReflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E95FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9B51E0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF9E1B" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="16" fill="url(#camGrad)" />
  <circle cx="340" cy="50" r="120" fill="#FF9E1B" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="60" cy="190" r="90" fill="#7353BA" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Orbit Rings Behind Camera -->
  <ellipse cx="200" cy="120" rx="160" ry="60" stroke="#FF9E1B" stroke-opacity="0.25" stroke-dasharray="4 6" />
  <ellipse cx="200" cy="120" rx="120" ry="40" stroke="#7353BA" stroke-opacity="0.3" />

  <!-- Orbiting Small Planet -->
  <circle cx="330" cy="100" r="8" fill="url(#orangeGlow)" />
  <circle cx="70" cy="135" r="5" fill="#4E95FF" />

  <!-- Cinema Camera Body -->
  <g transform="translate(105, 45)">
    <!-- Top Handle -->
    <path d="M50 15 H140 C145 15 150 20 150 25 V35 H40 V25 C40 20 45 15 50 15 Z" fill="#3D357A" stroke="#120E2E" stroke-width="2"/>
    <rect x="70" y="22" width="50" height="8" rx="4" fill="#FF9E1B" opacity="0.8"/>
    
    <!-- Microphone / Shotgun -->
    <rect x="135" y="8" width="55" height="12" rx="6" fill="#2A2454" stroke="#52488E" stroke-width="1.5"/>
    <line x1="145" y1="14" x2="180" y2="14" stroke="#FF9E1B" stroke-width="2" stroke-linecap="round"/>

    <!-- Main Rig -->
    <rect x="35" y="35" width="120" height="85" rx="12" fill="#241E4F" stroke="#FF9E1B" stroke-width="2.5" />
    
    <!-- Monitor Screen -->
    <rect x="-10" y="45" width="40" height="55" rx="6" fill="#15122E" stroke="#FF9E1B" stroke-width="2" />
    <rect x="-6" y="49" width="32" height="47" rx="3" fill="#1C1844" />
    <!-- Recording indicator & waveform on screen -->
    <circle cx="2" cy="56" r="3" fill="#FF3B30" />
    <path d="M-2 75 Q4 65 10 75 T22 75" fill="none" stroke="#FF9E1B" stroke-width="2" stroke-linecap="round" />
    <text x="7" y="58" fill="#FFFFFF" font-size="6" font-family="sans-serif" font-weight="bold">REC 4K</text>

    <!-- Matte Box / Lens Assembly -->
    <path d="M155 50 L195 38 V112 L155 100 Z" fill="#18133D" stroke="#52488E" stroke-width="2" />
    <rect x="145" y="55" width="15" height="40" rx="4" fill="#362E6E" />
    <ellipse cx="195" cy="75" rx="8" ry="36" fill="url(#lensReflect)" stroke="#FF9E1B" stroke-width="2" />
    <ellipse cx="195" cy="75" rx="4" ry="24" fill="#0B091D" />
    <circle cx="195" cy="72" r="3" fill="#FFFFFF" opacity="0.7" />

    <!-- Badges & Buttons -->
    <circle cx="65" cy="65" r="14" fill="#302966" stroke="#FF9E1B" stroke-width="1.5" />
    <path d="M62 58 L72 65 L62 72 Z" fill="#FF9E1B" />
    <rect x="95" y="55" width="45" height="6" rx="3" fill="#52488E" />
    <rect x="95" y="66" width="30" height="5" rx="2.5" fill="#FFCA3A" />
    <rect x="95" y="76" width="38" height="5" rx="2.5" fill="#4E95FF" />

    <!-- Tripod Mount / Base glow -->
    <rect x="75" y="120" width="40" height="12" rx="4" fill="#3D357A" />
    <circle cx="95" cy="126" r="3" fill="#FF9E1B" />
  </g>

  <!-- Floating Sparkles / Cosmic elements -->
  <path d="M30 60 L33 67 L40 70 L33 73 L30 80 L27 73 L20 70 L27 67 Z" fill="#FFCA3A" />
  <path d="M360 170 L362 174 L366 176 L362 178 L360 182 L358 178 L354 176 L358 174 Z" fill="#FF9E1B" />
</svg>
