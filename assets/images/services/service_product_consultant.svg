<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="stratGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#221845" />
      <stop offset="100%" stop-color="#0E0A20" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1439" />
      <stop offset="100%" stop-color="#120D26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD13B" />
      <stop offset="100%" stop-color="#FF9E1B" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7353BA" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="stratGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="16" fill="url(#stratGrad)" />
  <circle cx="80" cy="70" r="95" fill="#FF9E1B" fill-opacity="0.12" filter="url(#stratGlow)" />
  <circle cx="320" cy="170" r="100" fill="#7353BA" fill-opacity="0.15" filter="url(#stratGlow)" />

  <!-- Strategic Growth Trajectory Curve (Green / Gold Neon line) -->
  <path d="M 50 180 Q 140 170 200 120 T 350 45" stroke="#34D399" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 4" />
  
  <!-- Main Advisory Blueprint Container -->
  <g transform="translate(50, 35)">
    <rect width="300" height="170" rx="12" fill="url(#cardBg)" stroke="#7353BA" stroke-width="2" />
    
    <!-- Top Strategic Dashboard Header -->
    <rect x="0" y="0" width="300" height="30" rx="10" fill="#15102E" />
    <circle cx="16" cy="15" r="4" fill="#FF9E1B" />
    <circle cx="28" cy="15" r="4" fill="#38BDF8" />
    <circle cx="40" cy="15" r="4" fill="#34D399" />
    <rect x="60" y="8" width="130" height="14" rx="7" fill="#241B48" />
    <text x="75" y="18" fill="#A78BFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">MARMO / PRODUCT STRATEGY ROADMAP</text>
    
    <!-- 3 Strategic Roadmap Stages (Nodes connected by data arrows) -->
    <!-- Phase 1: Market & Audit -->
    <g transform="translate(20, 50)">
      <rect width="75" height="100" rx="8" fill="#1C163E" stroke="#FF9E1B" stroke-width="1.5" />
      <rect x="8" y="10" width="59" height="14" rx="4" fill="#FF9E1B" />
      <text x="37" y="20" fill="#0E0A20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" text-anchor="middle">01. AUDIT</text>
      <circle cx="37" cy="45" r="14" fill="#291E52" stroke="#FF9E1B" stroke-width="1" />
      <text x="37" y="49" font-size="12" text-anchor="middle">🔍</text>
      <rect x="10" y="68" width="55" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.6" />
      <rect x="10" y="78" width="40" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
      <rect x="10" y="88" width="50" height="5" rx="2.5" fill="#34D399" />
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 100 100 L 115 100" stroke="#FF9E1B" stroke-width="2" marker-end="url(#arrow)" />
    <polygon points="113,97 120,100 113,103" fill="#FF9E1B" />

    <!-- Phase 2: Architecture & Scalability -->
    <g transform="translate(122, 50)">
      <rect width="75" height="100" rx="8" fill="#1C163E" stroke="#7353BA" stroke-width="1.5" />
      <rect x="8" y="10" width="59" height="14" rx="4" fill="#7353BA" />
      <text x="37" y="20" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" text-anchor="middle">02. SYSTEM</text>
      <circle cx="37" cy="45" r="14" fill="#291E52" stroke="#7353BA" stroke-width="1" />
      <text x="37" y="49" font-size="12" text-anchor="middle">⚙️</text>
      <rect x="10" y="68" width="55" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.6" />
      <rect x="10" y="78" width="45" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
      <rect x="10" y="88" width="55" height="5" rx="2.5" fill="#38BDF8" />
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 202 100 L 217 100" stroke="#7353BA" stroke-width="2" />
    <polygon points="215,97 222,100 215,103" fill="#7353BA" />

    <!-- Phase 3: Launch & Growth Traction -->
    <g transform="translate(224, 50)">
      <rect width="60" height="100" rx="8" fill="#1C163E" stroke="#34D399" stroke-width="1.5" />
      <rect x="6" y="10" width="48" height="14" rx="4" fill="#34D399" />
      <text x="30" y="20" fill="#0E0A20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" text-anchor="middle">03. SCALE</text>
      <circle cx="30" cy="45" r="14" fill="#132B2B" stroke="#34D399" stroke-width="1" />
      <text x="30" y="49" font-size="12" text-anchor="middle">🚀</text>
      
      <!-- Growth Mini Bars -->
      <rect x="12" y="85" width="6" height="10" rx="2" fill="#34D399" fill-opacity="0.5" />
      <rect x="22" y="78" width="6" height="17" rx="2" fill="#34D399" fill-opacity="0.7" />
      <rect x="32" y="70" width="6" height="25" rx="2" fill="#34D399" fill-opacity="0.9" />
      <rect x="42" y="62" width="6" height="33" rx="2" fill="#34D399" />
    </g>
  </g>

  <!-- Floating Strategy Advisory Seal (Top Right) -->
  <g transform="translate(290, 15)">
    <circle cx="20" cy="20" r="20" fill="url(#goldGrad)" filter="url(#stratGlow)" />
    <polygon points="20,10 23,17 30,17 25,22 27,29 20,25 13,29 15,22 10,17 17,17" fill="#0E0A20" />
  </g>
</svg>