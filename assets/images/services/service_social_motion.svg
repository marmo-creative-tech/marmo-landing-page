<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="smGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#261A4E" />
      <stop offset="100%" stop-color="#0E0A22" />
    </linearGradient>
    <linearGradient id="smPhoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241B4B" />
      <stop offset="100%" stop-color="#140F2D" />
    </linearGradient>
    <linearGradient id="smOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF9E1B" />
    </linearGradient>
    <linearGradient id="smPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7353BA" />
    </linearGradient>
    <linearGradient id="smPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="smGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="16" fill="url(#smGrad)" />
  <circle cx="80" cy="60" r="90" fill="#EC4899" fill-opacity="0.12" filter="url(#smGlow)" />
  <circle cx="330" cy="180" r="100" fill="#FF9E1B" fill-opacity="0.15" filter="url(#smGlow)" />

  <!-- Orbit Trails -->
  <ellipse cx="200" cy="120" rx="150" ry="55" stroke="#A78BFA" stroke-opacity="0.3" stroke-dasharray="4 6" />
  <circle cx="60" cy="110" r="6" fill="#FF9E1B" />
  <circle cx="340" cy="130" r="8" fill="#EC4899" />

  <!-- Floating Carousel Card Back (Left) -->
  <g transform="translate(75, 45) rotate(-8)">
    <rect width="90" height="135" rx="10" fill="#1C143B" stroke="#7353BA" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="8" y="8" width="74" height="60" rx="6" fill="#2E2055" />
    <circle cx="45" cy="38" r="14" fill="#7353BA" fill-opacity="0.6" />
    <polygon points="41,32 53,38 41,44" fill="#FFFFFF" />
    <rect x="8" y="76" width="55" height="6" rx="3" fill="#A78BFA" fill-opacity="0.7" />
    <rect x="8" y="88" width="40" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>

  <!-- Floating Carousel Card Back (Right) -->
  <g transform="translate(235, 42) rotate(8)">
    <rect width="90" height="135" rx="10" fill="#1C143B" stroke="#FF9E1B" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="8" y="8" width="74" height="60" rx="6" fill="#3D2345" />
    <circle cx="45" cy="38" r="14" fill="#FF9E1B" fill-opacity="0.6" />
    <polygon points="41,32 53,38 41,44" fill="#FFFFFF" />
    <rect x="8" y="76" width="60" height="6" rx="3" fill="#FF9E1B" fill-opacity="0.8" />
    <rect x="8" y="88" width="45" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>

  <!-- Center Smartphone Mockup with Kinetic Motion Video -->
  <g transform="translate(145, 25)">
    <rect width="110" height="190" rx="18" fill="url(#smPhoneGrad)" stroke="url(#smOrange)" stroke-width="2.5" />
    <!-- Screen -->
    <rect x="6" y="10" width="98" height="170" rx="12" fill="#0F0C24" />
    
    <!-- Video Player Preview -->
    <rect x="10" y="18" width="90" height="115" rx="8" fill="url(#smPink)" fill-opacity="0.25" />
    <circle cx="55" cy="75" r="22" fill="url(#smOrange)" filter="url(#smGlow)" />
    <polygon points="50,66 65,75 50,84" fill="#120D31" />
    
    <!-- Motion Energy Sparks -->
    <path d="M 22 45 Q 32 35 40 45" stroke="#FFD13B" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 68 105 Q 78 115 88 105" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" />
    
    <!-- Engagement Likes/Metrics Floating Pill -->
    <rect x="12" y="142" width="55" height="18" rx="9" fill="#1E1643" stroke="#A78BFA" stroke-width="1" />
    <path d="M 20 151 C 20 148 23 147 25 149 C 27 147 30 148 30 151 C 30 154 25 157 25 157 C 25 157 20 154 20 151 Z" fill="#EC4899" />
    <text x="33" y="155" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">128K</text>

    <!-- Kinetic Sound Wave Bar -->
    <rect x="74" y="148" width="3" height="10" rx="1.5" fill="#FF9E1B" />
    <rect x="79" y="143" width="3" height="15" rx="1.5" fill="#FF9E1B" />
    <rect x="84" y="146" width="3" height="12" rx="1.5" fill="#FF9E1B" />
    <rect x="89" y="150" width="3" height="8" rx="1.5" fill="#FF9E1B" />
    <rect x="94" y="145" width="3" height="13" rx="1.5" fill="#FF9E1B" />

    <!-- Speaker Bar -->
    <rect x="42" y="5" width="26" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.4" />
  </g>

  <!-- Floating Reactions -->
  <g transform="translate(100, 160)">
    <circle cx="16" cy="16" r="16" fill="#1C143B" stroke="#EC4899" stroke-width="1.5" />
    <text x="16" y="21" font-size="14" text-anchor="middle">🔥</text>
  </g>
  <g transform="translate(265, 150)">
    <circle cx="16" cy="16" r="16" fill="#1C143B" stroke="#FF9E1B" stroke-width="1.5" />
    <text x="16" y="21" font-size="14" text-anchor="middle">✨</text>
  </g>
</svg>