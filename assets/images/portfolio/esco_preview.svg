<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="escoBg" x1="0" y1="0" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191544" />
      <stop offset="100%" stop-color="#0E0B28" />
    </linearGradient>
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B5C96" />
      <stop offset="100%" stop-color="#052E4E" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <rect width="480" height="320" rx="16" fill="url(#escoBg)" />

  <!-- Booklet mockup spread -->
  <g transform="translate(60, 40)">
    <!-- Shadow -->
    <rect x="25" y="25" width="310" height="215" rx="10" fill="#000000" opacity="0.4" />

    <!-- Left Page / Cover -->
    <g transform="translate(15, 10)">
      <rect x="0" y="0" width="160" height="215" rx="8" fill="url(#bookCover)" stroke="#38BDF8" stroke-width="1.5" />
      <!-- Logo ESCO -->
      <rect x="20" y="20" width="50" height="16" rx="4" fill="#0284C7" />
      <text x="26" y="32" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="9" font-weight="800">ESCO</text>
      <text x="20" y="65" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">The Brief History of</text>
      <text x="20" y="80" fill="#38BDF8" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">ESCO LIFESCIENCES</text>
      
      <!-- Laboratory visual grid -->
      <g transform="translate(18, 105)">
        <rect width="124" height="85" rx="6" fill="#082F49" />
        <circle cx="40" cy="40" r="18" fill="#0284C7" opacity="0.5" />
        <rect x="70" y="25" width="40" height="6" rx="3" fill="#38BDF8" />
        <rect x="70" y="37" width="35" height="5" rx="2.5" fill="#7DD3FC" opacity="0.7" />
        <rect x="70" y="47" width="45" height="5" rx="2.5" fill="#7DD3FC" opacity="0.5" />
        <rect x="20" y="70" width="85" height="4" rx="2" fill="#0EA5E9" />
      </g>
    </g>

    <!-- Right Page / Content -->
    <g transform="translate(185, 10)">
      <rect x="0" y="0" width="160" height="215" rx="8" fill="url(#pageGrad)" stroke="#CBD5E1" stroke-width="1" />
      <rect x="18" y="20" width="124" height="24" rx="4" fill="#E2E8F0" />
      <text x="26" y="35" fill="#0F172A" font-family="'Outfit', sans-serif" font-size="7" font-weight="700">Product &amp; Service Management System</text>
      <text x="18" y="65" fill="#0284C7" font-family="'Outfit', sans-serif" font-size="9" font-weight="700">The Transition to Life Science</text>
      <rect x="18" y="75" width="124" height="3" rx="1.5" fill="#CBD5E1" />
      <rect x="18" y="83" width="110" height="3" rx="1.5" fill="#CBD5E1" />
      <rect x="18" y="91" width="118" height="3" rx="1.5" fill="#CBD5E1" />

      <!-- Photo mockup -->
      <rect x="18" y="105" width="124" height="65" rx="5" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
      <circle cx="50" cy="135" r="14" fill="#38BDF8" opacity="0.4" />
      <rect x="75" y="125" width="55" height="5" rx="2" fill="#0284C7" />
      <rect x="75" y="135" width="45" height="4" rx="2" fill="#64748B" />

      <!-- Bottom ESCO logo -->
      <text x="18" y="195" fill="#0284C7" font-family="'Outfit', sans-serif" font-size="9" font-weight="800">ESCO</text>
      <text x="18" y="204" fill="#64748B" font-family="'Outfit', sans-serif" font-size="6">Improving lives through science.</text>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(24, 275)">
    <rect width="110" height="28" rx="14" fill="#FF9E1B" stroke="#000000" stroke-width="1.5" />
    <text x="16" y="18" fill="#120E2E" font-family="'Lilita One', sans-serif" font-size="12">BOOKLET · 2023</text>
  </g>
</svg>
